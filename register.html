<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · TechForce Workspace</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/common.js" defer></script><script src="assets/js/auth.js" defer></script></head>
<body class="auth-page"><a class="back-home" href="index.html">← TechForce Workspace</a><main class="auth-card"><div class="auth-brand"><span class="brand-mark">TF</span></div><div class="eyebrow">CREATE YOUR ACCOUNT</div><h1>Get started</h1><p class="muted">Create your account, then request workspace access.</p><button id="googleBtn" class="btn btn-google btn-full"><span class="google-g">G</span> Sign up with Google</button><div class="or-divider"><span>or use email</span></div><form id="registerForm"><label>Full name<input id="name" type="text" autocomplete="name" placeholder="Your name" required maxlength="80"></label><label>Email address<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label>Password<input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8"></label><button class="btn btn-primary btn-full" type="submit">Create account <span>→</span></button></form><div id="message" class="message" role="status"></div><p class="auth-foot">Already registered? <a href="login.html">Sign in</a></p><p class="tiny-note">Creating an account does not automatically grant workspace access. An administrator must approve your request.</p></main></body></html>
